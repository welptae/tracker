<!DOCTYPE html>
<html lang="en"><head><title>Log in | Tracker</title>
<meta name="description" content="Log in to track your university assignments and deadlines.">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0d6efd"><link rel="manifest" href="assets/manifest.webmanifest">
<meta name="author" content="Nur Saadah"><meta name="keywords" content="assignment tracker, university, deadlines, IMS566">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%230d6efd%22/><text x=%2250%22 y=%2272%22 font-size=%2270%22 text-anchor=%22middle%22 fill=%22white%22>t</text></svg>">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"><link href="css/dark.css" rel="stylesheet"></head>
<body>
<div class="split">
  <section class="split-brand">
    <span class="wordmark fs-3">tracker</span>
    <div><h1>Never miss a due date again.</h1>
      <p class="muted mt-3">Keep your assignments, courses and due weeks in one place. Log in to see what is next.</p></div>
    <div class="swatches" aria-hidden="true"><span style="background:#cfe2ff"></span><span style="background:#9ec5fe"></span><span style="background:#6ea8fe"></span><span style="background:#0d6efd"></span><span style="background:#052c65"></span></div>
  </section>
  <section class="split-form"><div class="box">
    <h2 class="h4 mb-3">Log in</h2>
    <div id="msg" class="d-none" role="alert"></div>
    <form id="loginForm" novalidate>
      <div class="mb-3"><label class="form-label" for="username">Username</label><input id="username" class="form-control form-control-lg" autocomplete="username" autofocus></div>
      <div class="mb-3"><label class="form-label" for="password">Password</label><div class="pw-wrap"><input id="password" type="password" class="form-control form-control-lg" autocomplete="current-password"><button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password" aria-pressed="false"><i class="bi bi-eye"></i></button></div></div>
      <button class="btn btn-primary btn-lg w-100" type="submit">Log in</button>
    </form>
  </div></section>
</div>
<script src="js/data.js"></script><script src="js/app.js"></script><script src="js/auth.js"></script>
</body></html>
