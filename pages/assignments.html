<!DOCTYPE html>
<html lang="en"><head><title>Assignments | Tracker</title>
<meta name="description" content="All assignments with course, type, due week and status. Search, filter, sort, add, edit and update.">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0d6efd"><link rel="manifest" href="../assets/manifest.webmanifest">
<meta name="author" content="Nur Saadah"><meta name="keywords" content="assignment tracker, university, deadlines, IMS566">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%230d6efd%22/><text x=%2250%22 y=%2272%22 font-size=%2270%22 text-anchor=%22middle%22 fill=%22white%22>t</text></svg>">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet"><link href="../css/assignments.css" rel="stylesheet"><link href="../css/dark.css" rel="stylesheet"></head>
<body data-auth="1">
<header id="nav"></header>
<main class="container">
  <div class="page-head d-flex justify-content-between align-items-end"><div><h1 class="h2">Assignments</h1><p class="muted mb-0" id="count" aria-live="polite"></p></div>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addModal"><i class="bi bi-plus-lg me-1"></i>Add task</button></div>
  <div class="d-flex flex-wrap gap-2 mb-3" id="statusTabs" role="group" aria-label="Filter by status"></div>
  <section class="panel">
    <div class="d-flex flex-wrap gap-2 mb-3" id="pills" aria-label="Filter by course"></div>
    <div class="row g-2 mb-2"><div class="col-md-8"><input id="search" class="form-control" placeholder="Search course, topic or notes" aria-label="Search tasks"></div>
      <div class="col-md-4"><select id="sort" class="form-select" aria-label="Sort tasks"><option value="new">Sort: newest</option><option value="course">Sort: course</option><option value="week">Sort: earliest due</option><option value="priority">Sort: priority</option></select></div></div>
    <div id="taskList"></div>
  </section>
</main>
<div class="modal fade" id="addModal" tabindex="-1" aria-labelledby="addTitle" aria-hidden="true"><div class="modal-dialog"><div class="modal-content" style="border-radius:2px">
  <div class="modal-header"><h2 class="modal-title h5" id="addTitle">Add task</h2><button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
  <div class="modal-body"><form id="addForm" onsubmit="return false">
    <div class="mb-3"><label class="form-label" for="nTopic">Topic</label><input id="nTopic" class="form-control"></div>
    <div class="row g-3"><div class="col-6"><label class="form-label" for="nCourse">Course</label><select id="nCourse" class="form-select"></select></div>
      <div class="col-6"><label class="form-label" for="nType">Type</label><select id="nType" class="form-select"><option>Individual</option><option>Group</option></select></div>
      <div class="col-12 d-none" id="newSubject"><div class="row g-3 p-2 mx-0 border rounded-1 bg-light">
        <div class="col-sm-5"><label class="form-label" for="nNewCode">New course code</label><input id="nNewCode" class="form-control" placeholder="e.g. IMS567" maxlength="12"></div>
        <div class="col-sm-7"><label class="form-label" for="nNewName">Subject name (optional)</label><input id="nNewName" class="form-control" placeholder="e.g. Advanced Web Design"></div>
      </div></div>
      <div class="col-6"><label class="form-label" for="nWeek">Due week</label><input id="nWeek" type="text" maxlength="3" autocomplete="off" value="TBA" class="form-control" aria-describedby="nWeekHelp"><div class="form-text" id="nWeekHelp">A number from 1 to 16, or TBA.</div></div>
      <div class="col-6"><label class="form-label" for="nStatus">Status</label><select id="nStatus" class="form-select"><option>Not started</option><option>In progress</option><option>Completed</option></select></div>
      <div class="col-6"><label class="form-label" for="nPriority">Priority</label><select id="nPriority" class="form-select"><option>Low</option><option selected>Medium</option><option>High</option></select></div>
      <div class="col-12"><label class="form-label" for="nNotes">Notes</label><input id="nNotes" class="form-control"></div></div>
  </form></div>
  <div class="modal-footer"><button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="saveTask">Save task</button></div>
</div></div></div>
<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="../js/data.js"></script><script src="../js/app.js"></script><script src="../js/assignments.js"></script>
</body></html>
