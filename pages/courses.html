<!DOCTYPE html>
<html lang="en"><head><title>Courses | Tracker</title>
<meta name="description" content="Courses with task progress, search and sort.">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0d6efd"><link rel="manifest" href="../assets/manifest.webmanifest">
<meta name="author" content="Nur Saadah"><meta name="keywords" content="assignment tracker, university, deadlines, IMS566">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%230d6efd%22/><text x=%2250%22 y=%2272%22 font-size=%2270%22 text-anchor=%22middle%22 fill=%22white%22>t</text></svg>">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet"><link href="../css/dark.css" rel="stylesheet"></head>
<body data-auth="1">
<header id="nav"></header>
<main class="container">
  <div class="page-head d-flex justify-content-between align-items-end"><div><h1 class="h2">Courses</h1><p class="muted mb-0">Progress per course. Click a course to see its tasks.</p></div></div>
  <div class="row g-2 align-items-center mb-4">
    <div class="col-md-6 col-lg-5"><label class="visually-hidden" for="cSearch">Search courses</label>
      <div class="input-group"><span class="input-group-text"><i class="bi bi-search"></i></span><input id="cSearch" type="search" class="form-control" placeholder="Search by course code or name" autocomplete="off"></div></div>
    <div class="col-md-4 col-lg-3"><label class="visually-hidden" for="cSort">Sort courses</label>
      <select id="cSort" class="form-select"><option value="code">Sort: course code</option><option value="tasks">Sort: most tasks</option><option value="high">Sort: progress (high to low)</option><option value="low">Sort: progress (low to high)</option></select></div>
  </div>
  <section id="courseGrid" aria-label="Courses"></section>
</main>
<div class="modal fade" id="courseModal" tabindex="-1" aria-labelledby="cmTitle" aria-hidden="true"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content">
  <div class="modal-header"><div><h2 class="modal-title h5" id="cmTitle"></h2><div class="muted small" id="cmName"></div></div><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
  <div class="modal-body">
    <div class="d-flex flex-wrap gap-3 align-items-end mb-3">
      <div class="flex-grow-1"><div class="bar"><span id="cmBar"></span></div><div class="small mt-1" id="cmPct"></div></div>
    </div>
    <ul class="list-group list-group-flush" id="cmList"></ul>
  </div>
  <div class="modal-footer"><button class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button><a class="btn btn-primary" id="cmOpen" href="assignments.html">Open in Assignments</a></div>
</div></div></div>
<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="../js/data.js"></script><script src="../js/app.js"></script><script src="../js/courses.js"></script>
</body></html>
