<!DOCTYPE html>
<html lang="en"><head><title>Timetable | Tracker</title>
<meta name="description" content="Weekly class timetable with a next-class countdown.">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0d6efd"><link rel="manifest" href="../assets/manifest.webmanifest">
<meta name="author" content="Nur Saadah"><meta name="keywords" content="assignment tracker, university, deadlines, IMS566">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%230d6efd%22/><text x=%2250%22 y=%2272%22 font-size=%2270%22 text-anchor=%22middle%22 fill=%22white%22>t</text></svg>">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet"><link href="../css/timetable.css" rel="stylesheet"><link href="../css/dark.css" rel="stylesheet"></head>
<body data-auth="1">
<header id="nav"></header>
<main class="container">
  <div class="page-head d-flex flex-wrap justify-content-between align-items-end gap-2"><div><h1 class="h2">Timetable</h1><p class="muted mb-0">Your weekly lectures and tutorials. Click a class to edit it.</p></div>
    <button class="btn btn-primary" id="addClass"><i class="bi bi-plus-lg"></i> Add class</button></div>

  <section class="panel tt-next mb-4" id="nextClass" role="status" aria-label="Next class"></section>

  <p class="muted d-none" id="ttEmpty">No classes yet. Use <strong>Add class</strong> to build your timetable.</p>
  <section id="ttGrid" class="tt-wrap d-none d-md-block" aria-label="Weekly timetable grid"></section>
  <section id="ttAgenda" class="d-md-none" aria-label="Weekly timetable by day"></section>
</main>

<div class="modal fade" id="classModal" tabindex="-1" aria-labelledby="cTitle" aria-hidden="true"><div class="modal-dialog"><div class="modal-content" style="border-radius:2px">
  <div class="modal-header"><h2 class="modal-title h5" id="cTitle">Add class</h2><button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
  <div class="modal-body"><form id="classForm" onsubmit="return false">
    <div class="row g-3">
      <div class="col-12"><label class="form-label" for="cCourse">Course</label><select id="cCourse" class="form-select"></select></div>
      <div class="col-12 d-none" id="newSubject"><div class="row g-3 p-2 mx-0 border rounded-1 bg-light">
        <div class="col-sm-5"><label class="form-label" for="cNewCode">New course code</label><input id="cNewCode" class="form-control" placeholder="e.g. IMS567" maxlength="12"></div>
        <div class="col-sm-7"><label class="form-label" for="cNewName">Subject name (optional)</label><input id="cNewName" class="form-control" placeholder="e.g. Advanced Web Design"></div>
      </div></div>
      <div class="col-6"><label class="form-label" for="cKind">Type</label><select id="cKind" class="form-select"><option>Lecture</option><option>Tutorial</option></select></div>
      <div class="col-6"><label class="form-label" for="cDay">Day</label><select id="cDay" class="form-select"></select></div>
      <div class="col-6"><label class="form-label" for="cStart">Start time</label><input id="cStart" type="time" class="form-control" value="09:00"></div>
      <div class="col-6"><label class="form-label" for="cEnd">End time</label><input id="cEnd" type="time" class="form-control" value="11:00"></div>
      <div class="col-6"><label class="form-label" for="cRoom">Room</label><input id="cRoom" class="form-control" placeholder="e.g. DK 3" maxlength="30"></div>
      <div class="col-6"><label class="form-label" for="cLect">Lecturer</label><input id="cLect" class="form-control" placeholder="e.g. Dr. Aisyah" maxlength="60"></div>
    </div>
    <div class="text-danger small mt-3" id="cErr" role="alert"></div>
  </form></div>
  <div class="modal-footer"><button class="btn btn-outline-danger me-auto d-none" id="cDelete"><i class="bi bi-trash"></i> Delete</button><button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="cSave">Save class</button></div>
</div></div></div>
<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="../js/data.js"></script><script src="../js/app.js"></script><script src="../js/timetable.js"></script>
</body></html>
